# What must pass before anything is merged: the same lint and tests as
# `task check`, and the Rust the phone builds compile, which a check on the
# host never sees (`task check:mobile`, split here by the runner each needs).
#
# Runs on every pull request and on every push to develop. The release
# workflow calls it too (workflow_call), so main is checked before it builds.

name: Check

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an older check pointless; main's
  # (called from the release) is never cancelled.
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24
  PNPM_VERSION: 12

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1

      - run: pnpm install --frozen-lockfile

      - name: task check
        run: task check

  android:
    name: Check the Android Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: android

      # `ring` compiles C, so the check needs the NDK's clang — the runner
      # carries an NDK (ANDROID_NDK_LATEST_HOME).
      - name: cargo check
        working-directory: src-tauri
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$(ls "$bin"/aarch64-linux-android*-clang | sort -V | tail -1)"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo check --locked --target aarch64-linux-android

  ios:
    name: Check the iOS Rust
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ios

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --target aarch64-apple-ios-sim
