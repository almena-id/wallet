[package]
name = "wallet"
version = "0.1.0"
description = "Almena Wallet"
authors = ["Almena ID"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` puts the wallet on a computer's bar, and `image-png` decodes the
# glyph it shows there (`tray.rs`).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The identity: every BIP-39 wordlist, so the phrase is written in the language
# the wallet is read in and a phrase in any of them can be brought back; then
# SLIP-0010 (HMAC-SHA512) down to the ed25519 key a `did:key` names.
bip39 = { version = "2.2", features = ["zeroize", "all-languages"] }
zeroize = "1.9"
bs58 = "0.5"
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
# Keeping the identity between launches. XChaCha20-Poly1305 rather than AES-GCM:
# its nonce is wide enough to be drawn at random with no counter to keep, and it
# is constant-time in software everywhere. Argon2id is what stands between four
# digits and a stolen record, so its cost parameters are written into the record.
# `alloc` only: the randomness comes from `getrandom`.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", features = ["zeroize"] }
# The platform's own secret store, named per platform below rather than picked
# by the `keyring` umbrella crate, whose Android choice is an in-memory stub
# that loses the identity on every launch. See `vault::store`.
keyring-core = "1"
# Messaging: DIDComm v2.0 messages, envelopes and DID resolution, from the
# mediator's own repository — the same code the mediator answers with. Pinned
# to a release tag; see `docs/didcomm.md` there.
almena-didcomm = { git = "https://github.com/almena-id/mediator", tag = "v2026.09.1" }
url = "2.5"
# Reaching a mediator. Rustls with `ring` and the Mozilla roots rather than the
# platform verifier: the verifier needs a JNI hand-off on Android and aws-lc-rs
# needs a C toolchain for every target, and this is the same code on all five.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
async-trait = "0.1.92"
# Live delivery: a WebSocket to the mediator while the wallet is in front, on
# the same Rustls configuration as the HTTPS client (see `messaging::live`).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["time", "macros"] }
tauri-plugin-clipboard-manager = "2"
# Deep links: `almena://` — the scheme the wallet's own invitations are
# written with — opens the wallet, on every platform (see `lib.rs`).
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The camera, for reading a code somebody is showing the wallet. Only a phone
# or a tablet has one the wallet may drive; the plugin does not exist for the
# desktops, and the tab that opens it is not offered there either.
tauri-plugin-barcode-scanner = "2"
# Push: the FCM or APNs device token the mediator notifies (`messaging::push`).
# A release candidate, pinned exactly; `notify-rust` is its desktop half, which
# the wallet does not use.
tauri-plugin-notifications = { version = "=0.5.0-rc.14", default-features = false, features = ["push-notifications"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The system's trusted roots, read by a debug build only (`mediator::tls`), so
# a development service behind a locally trusted CA — the dev Caddy's for
# api.almena.id — is reachable. A release build trusts the Mozilla roots alone.
rustls-native-certs = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
# `protected` is the data protection keychain, the only one whose items can be
# kept to this device alone.
apple-native-keyring-store = { version = "1", features = ["protected"] }
# The device key when the iPhone's own lock is the wallet's: written here
# rather than through the store above, which cannot ask for the user-presence
# check and "this device only" together — see `vault::store::set_device_lock`.
# The same version the store already brings in.
security-framework = "3"
# Turning down the second window an iPad offers — see `scene.rs`. The same
# `objc2-ui-kit` Tauri itself is built on, with only the pieces that ask the
# application to destroy a scene session.
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "UIApplication",
    "UIScene",
    "UISceneSession",
    "UISceneOptions",
    "block2",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# **Both keychains, and each one for what only it can do.** The record lives in
# the file keychain, which every build can reach — signed or not — so an
# identity is never held hostage by how the copy of the wallet was built. The
# device key lives in the data protection keychain, the only one on macOS whose
# items the system itself holds behind Touch ID; it answers only to a signed
# build, and where it does not, `vault::store` says so and the PIN is the only
# way in.
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }
# Whether this Mac can recognise its owner at all: without a sensor,
# `require-user-presence` falls back to the login password, which is not the
# lock the switch offering it names.
objc2 = "0.6"
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# The pure Rust D-Bus client: the alternative links libdbus and needs a C
# toolchain for every target this is cross-compiled from.
zbus-secret-service-keyring-store = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Opening at login, when the person turns it on in Security; the wallet then
# starts minimised (`window::MINIMIZED`).
tauri-plugin-autostart = "2"
# The system's notifications, for messages that arrive while the wallet is on
# the tray or minimised (`notify.rs`). A computer only: on a phone the push
# plugin is a fork of this one and claims the same native symbols.
tauri-plugin-notification = "2"
# A computer runs one wallet: a second launch — or an `almena://` link opened
# while it runs — goes to the one already open (`deep-link` forwards the URL).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Where the window was left: its size, position and whether it was maximised.
tauri-plugin-window-state = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
