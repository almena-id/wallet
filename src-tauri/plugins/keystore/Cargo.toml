[package]
name = "almena-keystore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Android Keystore, for Almena Wallet's vault: seals bytes under a key the device's secure hardware holds and never hands out."
publish = false
# Tells tauri-build where the Android library is, so it is part of the app's
# Gradle project however often `gen/android` is regenerated.
links = "almena-keystore"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
